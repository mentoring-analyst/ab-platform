# A/B Platform — учебный стенд Симулятора бигтеха
#
# Лёгкий профиль (базы + сплитовалка + генератор):  docker compose up -d
# Полный профиль (+ Airflow, + Superset):           docker compose --profile full up -d
#
# Лимиты памяти на каждом сервисе стоят намеренно: прожорливый процесс упадёт
# внутри своего контейнера с кодом 137, не утащив за собой соседей (см. docs/troubleshooting.md).

services:
  postgres:
    image: postgres:16-alpine
    container_name: ab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    ports:
      - "5434:5432"   # 5434 снаружи, чтобы не конфликтовать с data-platform
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-platform}"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512M

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: ab-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-platform}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP (DataGrip/DBeaver, clickhouse-connect)
      - "9001:9000"   # native
    volumes:
      - ch-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/config/limits.xml:/etc/clickhouse-server/config.d/limits.xml:ro
      - ./clickhouse/config/users-limits.xml:/etc/clickhouse-server/users.d/limits.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 2G

  splitter:
    build: ./splitter
    container_name: ab-splitter
    restart: unless-stopped
    environment:
      PG_DSN: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform}
      CH_HOST: clickhouse
      CH_PORT: 8123
      CH_USER: ${CLICKHOUSE_USER:-default}
      CH_PASSWORD: ${CLICKHOUSE_PASSWORD:-platform}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 256M

  generator:
    build: ./generator
    container_name: ab-generator
    restart: unless-stopped
    environment:
      PG_DSN: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform}
      CH_HOST: clickhouse
      CH_PORT: 8123
      CH_USER: ${CLICKHOUSE_USER:-default}
      CH_PASSWORD: ${CLICKHOUSE_PASSWORD:-platform}
      SPLITTER_URL: http://splitter:8000
      SIM_ACCEL: ${SIM_ACCEL:-144}
      HISTORY_DAYS: ${HISTORY_DAYS:-45}
      POP_PER_REGION: ${POP_PER_REGION:-25000}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      splitter:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

  # ---------- Полный профиль (--profile full): + Superset для бонус-уровня ----------

  superset:
    build: ./superset
    profiles: ["full"]
    container_name: ab-superset
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-ab-platform-superset-secret}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      DATABASE_DIALECT: postgresql+psycopg2
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_DB: superset
      DATABASE_USER: ${POSTGRES_USER:-platform}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-platform}
    ports:
      - "8089:8088"   # 8089 снаружи, чтобы не конфликтовать с data-platform
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1500M

volumes:
  pg-data:
  ch-data:
